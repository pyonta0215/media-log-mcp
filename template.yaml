AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: media-log-mcp remote — Lambda Function URL + Streamable HTTP MCP (メディア記録)

Parameters:
  McpPath:
    Type: String
    NoEcho: true
    Description: MCPエンドポイントの秘匿パス(例 /mcp/<ランダム文字列>)。コード外から渡す。
  AllowedCidr:
    Type: String
    Default: 160.79.104.0/21
    Description: 許可する送信元IPレンジ。Web利用時は 0.0.0.0/0 とCognitoを併用可能。
  CognitoDomain:
    Type: String
    Default: media-log
    Description: Cognito Hosted UIドメインのプレフィックス

Resources:
  MediaLogMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: media-log-mcp
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: lambda.handler
      CodeUri: ./
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          MCP_PATH: !Ref McpPath
          ALLOWED_CIDR: !Ref AllowedCidr
          S3_BUCKET: !Ref MediaBucket
          S3_KEY: media.json
          COGNITO_USER_POOL_ID: !Ref MediaUserPool
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_CLIENT_ID: !Ref MediaUserPoolClient
          AUTH_REQUIRED: "true"
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  MediaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: media-log-users
      AutoVerifiedAttributes: [email]
  MediaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MediaUserPool
      GenerateSecret: false
      CallbackURLs:
        - !Sub "https://${CognitoDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
      SupportedIdentityProviders: [COGNITO]
  MediaUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomain
      UserPoolId: !Ref MediaUserPool

Outputs:
  FunctionUrl:
    Description: Function URL。末尾に MCP_PATH を付けたものが MCP エンドポイント。
    Value: !GetAtt MediaLogMcpFunctionUrl.FunctionUrl
  UserPoolId:
    Value: !Ref MediaUserPool
  UserPoolClientId:
    Value: !Ref MediaUserPoolClient
  MediaBucketName:
    Value: !Ref MediaBucket
