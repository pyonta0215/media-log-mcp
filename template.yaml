AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: media-log-mcp remote — Lambda Function URL + Streamable HTTP MCP (メディア台帳・読み取り専用) + 台帳データの S3 バケット

Parameters:
  McpPath:
    Type: String
    NoEcho: true
    Description: MCPエンドポイントの秘匿パス(例 /mcp/<ランダム文字列>)。コード外から渡す。
  AllowedCidr:
    Type: String
    Default: 160.79.104.0/21
    Description: 許可する送信元IPレンジ(既定 = Anthropic outbound)。検証時は 0.0.0.0/0 に緩める。

Resources:
  # 台帳の正本(media.json)。巻き戻しは Versioning、古い版は30日で自動削除して課金を頭打ちにする。
  # スタックを消してもデータは残す(Retain)。
  MediaDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MediaDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaDataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaDataBucket.Arn
              - !Sub '${MediaDataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  MediaLogMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: media-log-mcp
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: lambda.handler
      CodeUri: dist/ # scripts/build-lambda.sh で作る。リポジトリ直下を指定しないこと
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          MCP_PATH: !Ref McpPath
          ALLOWED_CIDR: !Ref AllowedCidr
          MEDIA_STORE: !Sub 's3://${MediaDataBucket}/media.json'
      # リモート版は読み取り専用。台帳オブジェクトの GetObject だけを許可し、書き込み権限は持たせない
      # (IP制限+URL秘匿は「本人である」ことを確認できないため、突破されても書けないようにする)
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${MediaDataBucket.Arn}/media.json'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

Outputs:
  FunctionUrl:
    Description: Function URL。末尾に MCP_PATH を付けたものが MCP エンドポイント。
    Value: !GetAtt MediaLogMcpFunctionUrl.FunctionUrl
  MediaStore:
    Description: 台帳データの場所。ローカルの ~/.config/media-log-mcp/env の MEDIA_STORE に設定する。
    Value: !Sub 's3://${MediaDataBucket}/media.json'
