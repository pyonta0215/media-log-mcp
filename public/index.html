<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Log</title><link rel="stylesheet" href="/styles.css"></head><body>
<main><header><h1>Media Log</h1><p id="auth-note"></p><input id="token" type="password" placeholder="Cognito JWT (必要な場合)"><button id="save-token">トークン設定</button></header>
<section class="toolbar"><input id="keyword" placeholder="検索"><select id="type"><option value="">すべて</option></select><button id="search">検索</button><button id="add">追加</button></section>
<form id="editor" hidden><h2 id="form-title">追加</h2><input name="title" placeholder="タイトル" required maxlength="500"><select name="type" required></select><input name="creator" placeholder="作者"><input name="date" placeholder="日付"><textarea name="review" placeholder="感想"></textarea><input name="url" placeholder="URL (https://)"><input name="image" placeholder="画像URL (https://)"><button>保存</button><button type="button" id="cancel">キャンセル</button></form>
<div id="list"></div></main><script src="/app.js"></script></body></html>
